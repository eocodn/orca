name: ade-control-${ADE_CONTROL_RUN_ID:?set a unique run id for concurrency-safe execution}

services:
  tauri-contract:
    build:
      context: .
      dockerfile: Dockerfile.tauri-contract
    command:
      - sh
      - -euc
      - cargo fmt --manifest-path src-tauri/Cargo.toml -- --check && cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 >/dev/null
    init: true
    network_mode: host

  rust-host-core-contract:
    build:
      context: .
      dockerfile: Dockerfile.rust-control
    command:
      - sh
      - -euc
      - cargo fmt --all -- --check && cargo test --workspace && cargo clippy --workspace --all-targets -- -D warnings
    init: true
    network_mode: host

  worker-cli-contract:
    build:
      context: .
      dockerfile: Dockerfile.rust-control
    command:
      - sh
      - -euc
      - >-
        test "$$(cargo run --quiet --package ade-worker -- --json --worker-id wsl-ubuntu)"
        =
        '{"service":"ade-worker","worker_id":"wsl-ubuntu","generation":0,"status":"stopped","heartbeat_sequence":0}'
    init: true
    network_mode: host

  host-cli-contract:
    build:
      context: .
      dockerfile: Dockerfile.rust-control
    command:
      - sh
      - -euc
      - >-
        state_db=/tmp/ade-host-cli-contract.db;
        rm -f "$$state_db" "$$state_db-wal" "$$state_db-shm";
        output="$$(cargo run --quiet --package ade-host --
        --json --state-db "$$state_db" --register-workspace workspace-1
        --workspace-path 'C:\\workspaces\\one' --request-id request-1)";
        test "$$output" =
        '{"service":"ade-host","workspace_count":1,"ready_workspaces":0,"source":"sqlite-snapshot"}'
    init: true
    network_mode: host

  runtime-model-tests:
    build:
      context: .
      dockerfile: Dockerfile.control
    command:
      - pnpm
      - exec
      - vitest
      - run
      - --maxWorkers=1
      - --config
      - config/vitest.config.ts
      - src/main/runtime/terminal-output-path-candidates.test.ts
      - src/main/runtime/terminal-wait-detection.test.ts
      - src/main/runtime/terminal-tail-wait-state.test.ts
      - src/main/runtime/terminal-formatting-modules.test.ts
      - src/main/runtime/runtime-domain-boundaries.test.ts
      - src/main/runtime/mobile-notification-replay.test.ts
      - src/main/runtime/oversized-source-boundaries.test.ts
      - config/scripts/check-source-line-counts.test.mjs
      - src/main/runtime/orca-runtime-tail-wait-memo.test.ts
      - src/main/runtime/retained-tail-redraw-window.equivalence.test.ts
      - src/main/runtime/orca-runtime-path-candidate-history.test.ts
    init: true
    network_mode: host

  runtime-quality:
    build:
      context: .
      dockerfile: Dockerfile.control
    command:
      - timeout
      - --signal=TERM
      - --kill-after=30s
      - 10m
      - sh
      - -euc
      - >-
        node config/scripts/check-source-line-counts.mjs &&
        pnpm exec oxfmt --check
        src/main/runtime/terminal-output-path-candidates.ts
        src/main/runtime/terminal-output-path-candidates.test.ts
        src/main/runtime/terminal-wait-detection.ts
        src/main/runtime/terminal-wait-detection.test.ts
        src/main/runtime/terminal-tail-wait-state.ts
        src/main/runtime/terminal-tail-wait-state.test.ts
        src/main/runtime/terminal-formatting-modules.test.ts
        src/main/runtime/runtime-domain-boundaries.test.ts
        src/main/runtime/mobile-notification-replay.test.ts
        src/main/runtime/runtime-notification-registry.ts
        src/main/runtime/mobile-notification-replay.ts
        src/main/runtime/runtime-client-settings-commands.ts
        src/main/runtime/pty-layout-queue.ts
