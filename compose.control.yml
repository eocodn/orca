name: ade-control-${ADE_CONTROL_RUN_ID:?set a unique run id for concurrency-safe execution}

services:
  control-tests:
    build:
      context: .
      dockerfile: Dockerfile.control
    command:
      - sh
      - -euc
      - |
        exec timeout --signal=TERM --kill-after=30s 10m pnpm exec vitest run \
          --maxWorkers=1 \
          --config config/vitest.config.ts \
          src/cli/handlers/folder-workspace.test.ts \
          src/cli/handlers/terminal.test.ts \
          src/cli/runtime/execution-host.test.ts \
          src/shared/folder-workspaces.test.ts \
          src/cli/args.test.ts \
          src/cli/format.test.ts \
          src/preload/ssh-authority-forwarding.test.ts \
          src/cli/registry-parity.test.ts \
          src/cli/handlers/session.test.ts \
          src/cli/handler-group-manifest.test.ts \
         src/main/runtime/rpc/methods/repo.test.ts \
          src/main/runtime/rpc/methods/session-control.test.ts \
          src/main/runtime/rpc/methods/session-tabs.test.ts \
          src/main/runtime/rpc/methods/session-tabs-subscriptions.test.ts \
          src/main/runtime/session-control.test.ts \
          src/main/runtime/orca-runtime.test.ts \
          src/main/runtime/orca-runtime-terminal-retirement.test.ts \
          src/main/runtime/orca-runtime-terminal-create-idempotency.test.ts \
          src/main/runtime/runtime-rpc.test.ts \
          src/main/runtime/rpc/errors.test.ts \
          src/main/providers/ssh-pty-provider-resize.test.ts \
          src/main/providers/ssh-pty-provider.test.ts \
          src/main/ssh/ssh-relay-session-incarnation.test.ts \
          src/main/ssh/ssh-relay-session-cleanup-incarnation.test.ts \
          src/main/ssh/ssh-relay-session-reconnect-incarnation.test.ts \
          src/main/daemon/daemon-pty-adapter.test.ts \
          src/main/daemon/terminal-host.test.ts \
          src/main/ipc/pty.test.ts \
          src/main/ipc/ssh-pty-output-intake.test.ts \
          src/relay/pty-handler.test.ts \
          src/main/project-groups/folder-workspace-path-status.test.ts \
          src/main/persistence.test.ts
    init: true
    network_mode: host

  control-typecheck:
    build:
      context: .
      dockerfile: Dockerfile.control
    command:
      - timeout
      - --signal=TERM
      - --kill-after=30s
      - 10m
      - sh
      - -euc
      - pnpm exec tsc --noEmit -p config/tsconfig.node.json && pnpm exec tsc --noEmit -p config/tsconfig.tc.cli.json
    init: true
    network_mode: host

  control-quality:
    build:
      context: .
      dockerfile: Dockerfile.control
    command:
      - timeout
      - --signal=TERM
      - --kill-after=30s
      - 10m
      - sh
      - -euc
      - pnpm exec oxfmt --check src/cli/args.ts src/cli/args.test.ts src/cli/handlers/folder-workspace.ts src/cli/handlers/folder-workspace.test.ts src/cli/handlers/terminal.ts src/cli/handlers/terminal.test.ts src/cli/runtime/client.ts src/cli/runtime/execution-host.ts src/cli/runtime/execution-host.test.ts src/cli/runtime/mutation-recovery.ts src/cli/specs/core.ts src/cli/specs/folder-workspace.ts src/cli/specs/terminal.ts src/cli/terminal-format.ts src/main/daemon/daemon-pty-adapter.ts src/main/daemon/daemon-pty-adapter.test.ts src/main/ipc/pty.ts src/main/persistence.ts src/main/persistence.test.ts src/main/providers/ssh-pty-applied-size.ts src/main/providers/ssh-pty-provider-resize.test.ts src/main/providers/ssh-pty-provider.test.ts src/main/runtime/orca-runtime.ts src/main/runtime/orca-runtime.test.ts src/main/runtime/runtime-rpc.test.ts src/main/runtime/rpc/errors.ts src/main/runtime/rpc/errors.test.ts src/main/runtime/rpc/methods/folder-workspace.ts src/main/runtime/rpc/methods/repo.test.ts src/main/runtime/rpc/methods/terminal.ts src/shared/folder-workspaces.ts src/shared/folder-workspaces.test.ts src/shared/runtime-types.ts src/shared/terminal-dimensions.ts src/shared/types.ts src/main/daemon/daemon-pty-provider.ts src/main/daemon/daemon-pty-resize-response.ts src/main/daemon/daemon-pty-router-events.ts src/main/daemon/daemon-server.ts src/main/daemon/daemon-stream-data-batcher.ts src/main/daemon/daemon-stream-data-entry.ts src/main/daemon/daemon-stream-data-split.ts src/main/daemon/daemon-stream-events.ts src/main/daemon/daemon-stream-keep-tail-drop.ts src/main/daemon/session.ts src/main/daemon/terminal-host-create-contract.ts src/main/ipc/pty.test.ts src/main/ipc/ssh-pty-output-intake.ts src/main/ipc/ssh-pty-output-intake.test.ts src/main/providers/local-pty-provider.ts src/main/providers/pty-provider-events.ts src/main/providers/ssh-pty-provider-rpc.ts src/main/providers/ssh-pty-provider.ts && pnpm exec oxlint src/cli/args.ts src/cli/args.test.ts src/cli/handlers/folder-workspace.ts src/cli/handlers/folder-workspace.test.ts src/cli/handlers/terminal.ts src/cli/handlers/terminal.test.ts src/cli/runtime/client.ts src/cli/runtime/execution-host.ts src/cli/runtime/execution-host.test.ts src/cli/runtime/mutation-recovery.ts src/cli/specs/core.ts src/cli/specs/folder-workspace.ts src/cli/specs/terminal.ts src/cli/terminal-format.ts src/main/daemon/daemon-pty-adapter.ts src/main/daemon/daemon-pty-adapter.test.ts src/main/providers/ssh-pty-applied-size.ts src/main/providers/ssh-pty-provider-resize.test.ts src/main/providers/ssh-pty-provider.test.ts src/main/runtime/rpc/errors.ts src/main/runtime/rpc/errors.test.ts src/main/runtime/rpc/methods/terminal.ts src/main/runtime/runtime-rpc.test.ts src/shared/folder-workspaces.ts src/shared/folder-workspaces.test.ts src/shared/runtime-types.ts src/shared/terminal-dimensions.ts src/main/daemon/daemon-pty-provider.ts src/main/daemon/daemon-pty-resize-response.ts src/main/daemon/daemon-pty-router-events.ts src/main/daemon/daemon-stream-data-batcher.ts src/main/daemon/daemon-stream-data-entry.ts src/main/daemon/daemon-stream-data-split.ts src/main/daemon/daemon-stream-events.ts src/main/daemon/daemon-stream-keep-tail-drop.ts src/main/daemon/session.ts src/main/daemon/terminal-host-create-contract.ts src/main/ipc/ssh-pty-output-intake.ts src/main/providers/pty-provider-events.ts src/main/providers/ssh-pty-provider-rpc.ts src/main/providers/ssh-pty-provider.ts
    init: true
    network_mode: host

  control-format:
    build:
      context: .
      dockerfile: Dockerfile.control
    command:
      - pnpm
      - exec
      - oxfmt
      - src/cli/handlers/folder-workspace.test.ts
      - src/cli/handlers/folder-workspace.ts
      - src/cli/handler-group-manifest.ts
      - src/cli/handlers/terminal.test.ts
      - src/cli/handlers/terminal.ts
      - src/cli/runtime/client.ts
      - src/cli/runtime/execution-host.ts
      - src/cli/runtime/execution-host.test.ts
      - src/cli/runtime/mutation-recovery.ts
      - src/main/persistence.test.ts
      - src/main/persistence.ts
      - src/cli/specs/core.ts
      - src/cli/specs/terminal.ts
      - src/cli/terminal-format.ts
      - src/main/ipc/pty.ts
      - src/main/runtime/orca-runtime.test.ts
      - src/main/runtime/orca-runtime-terminal-retirement.test.ts
      - src/main/runtime/orca-runtime.ts
      - src/main/runtime/session-control.test.ts
      - src/main/runtime/runtime-rpc.test.ts
      - src/main/providers/ssh-pty-applied-size.ts
      - src/main/providers/ssh-pty-provider-resize.test.ts
      - src/main/providers/ssh-pty-provider.test.ts
      - src/main/ssh/ssh-relay-session.ts
      - src/main/ssh/ssh-relay-session-incarnation.test.ts
      - src/main/ssh/ssh-relay-session-cleanup-incarnation.test.ts
      - src/main/ssh/ssh-relay-session-reconnect-incarnation.test.ts
      - src/main/daemon/daemon-pty-adapter.ts
      - src/main/daemon/daemon-pty-adapter.test.ts
      - src/main/runtime/rpc/errors.ts
      - src/main/runtime/rpc/errors.test.ts
      - src/main/runtime/rpc/methods/terminal.ts
      - src/main/runtime/rpc/methods/session-control.ts
      - src/main/runtime/rpc/methods/session-control.test.ts
      - src/main/runtime/rpc/methods/session-tabs.test.ts
      - src/main/runtime/rpc/methods/session-tabs-subscriptions.test.ts
      - src/shared/runtime-types.ts
      - src/shared/terminal-dimensions.ts
      - src/shared/folder-workspaces.ts
      - src/shared/folder-workspaces.test.ts
      - src/main/daemon/daemon-pty-provider.ts
      - src/main/daemon/daemon-pty-resize-response.ts
      - src/main/daemon/daemon-pty-router-events.ts
      - src/main/daemon/daemon-server.ts
      - src/main/daemon/daemon-stream-data-batcher.ts
      - src/main/daemon/daemon-stream-data-entry.ts
      - src/main/daemon/daemon-stream-data-split.ts
      - src/main/daemon/daemon-stream-events.ts
      - src/main/daemon/daemon-stream-keep-tail-drop.ts
      - src/main/daemon/session.ts
      - src/main/daemon/terminal-host-create-contract.ts
      - src/main/ipc/pty.test.ts
      - src/main/ipc/ssh-pty-output-intake.ts
      - src/main/ipc/ssh-pty-output-intake.test.ts
      - src/main/providers/local-pty-provider.ts
      - src/main/providers/pty-provider-events.ts
      - src/main/providers/ssh-pty-provider-rpc.ts
      - src/main/providers/ssh-pty-provider.ts
    init: true
    network_mode: host
    profiles: [maintenance]
    volumes:
      - ./:/workspace
      - /workspace/node_modules

  session-quality:
    build:
      context: .
      dockerfile: Dockerfile.control
    command:
      - timeout
      - --signal=TERM
      - --kill-after=30s
      - 10m
      - sh
      - -euc
      - >-
        pnpm exec oxfmt --check src/cli/format.ts src/cli/handler-group-manifest.ts
        src/cli/registry-parity.test.ts src/cli/specs/index.ts src/cli/specs/session.ts
        src/cli/session-format.ts src/cli/handlers/session.ts src/cli/handlers/session.test.ts
        src/main/runtime/orca-runtime.ts src/main/runtime/session-control.test.ts
        src/main/runtime/rpc/methods/index.ts src/main/runtime/rpc/methods/session-control.ts
        src/main/runtime/rpc/methods/session-control.test.ts src/main/runtime/rpc/methods/session-tabs.test.ts
        src/main/runtime/rpc/methods/session-tabs-subscriptions.test.ts
        src/main/persistence.ts
        src/main/persistence.test.ts src/shared/runtime-types.ts &&
        pnpm exec oxlint src/cli/format.ts src/cli/handler-group-manifest.ts
        src/cli/registry-parity.test.ts src/cli/specs/index.ts src/cli/specs/session.ts
        src/cli/session-format.ts src/cli/handlers/session.ts src/cli/handlers/session.test.ts
        src/main/runtime/orca-runtime.ts src/main/runtime/session-control.test.ts
        src/main/runtime/rpc/methods/index.ts src/main/runtime/rpc/methods/session-control.ts
        src/main/runtime/rpc/methods/session-control.test.ts src/main/runtime/rpc/methods/session-tabs.test.ts
        src/main/runtime/rpc/methods/session-tabs-subscriptions.test.ts
        src/main/persistence.ts
        src/main/persistence.test.ts src/shared/runtime-types.ts
    init: true
    network_mode: host

  ssh-quality:
    build:
      context: .
      dockerfile: Dockerfile.control
    command:
      - timeout
      - --signal=TERM
      - --kill-after=30s
      - 10m
      - sh
      - -euc
      - >-
        pnpm exec oxfmt --check src/main/ssh/ssh-relay-session.ts
        src/main/ssh/ssh-relay-session-incarnation.test.ts
        src/main/ssh/ssh-relay-session-cleanup-incarnation.test.ts
        src/main/ssh/ssh-relay-session-data-delivery.test.ts
        src/main/ssh/ssh-relay-session-managed-hooks.test.ts
        src/main/ssh/ssh-relay-session-model-migration.test.ts
        src/main/ssh/ssh-relay-session-reconnect-incarnation.test.ts
        src/main/ssh/ssh-relay-session-recovery-races.test.ts
        src/main/ssh/ssh-relay-session-terminal-error.test.ts
        src/main/ssh/ssh-relay-session.test.ts
        src/preload/index.ts
        src/preload/ssh-authority-forwarding.test.ts &&
        pnpm exec oxlint src/main/ssh/ssh-relay-session.ts
        src/main/ssh/ssh-relay-session-incarnation.test.ts
        src/main/ssh/ssh-relay-session-cleanup-incarnation.test.ts
        src/main/ssh/ssh-relay-session-data-delivery.test.ts
        src/main/ssh/ssh-relay-session-managed-hooks.test.ts
        src/main/ssh/ssh-relay-session-model-migration.test.ts
        src/main/ssh/ssh-relay-session-reconnect-incarnation.test.ts
        src/main/ssh/ssh-relay-session-recovery-races.test.ts
        src/main/ssh/ssh-relay-session-terminal-error.test.ts
        src/main/ssh/ssh-relay-session.test.ts
        src/preload/index.ts
        src/preload/ssh-authority-forwarding.test.ts
    init: true
    network_mode: host

  preload-tests:
    build:
      context: .
      dockerfile: Dockerfile.control
    command:
      - timeout
      - --signal=TERM
      - --kill-after=30s
      - 10m
      - pnpm
      - exec
      - vitest
      - run
      - --maxWorkers=1
      - --config
      - config/vitest.config.ts
      - src/preload/ssh-authority-forwarding.test.ts
    init: true
    network_mode: host
