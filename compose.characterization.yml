name: ade-characterization-${ADE_CHARACTERIZATION_RUN_ID:?set a unique run id for concurrency-safe execution}

services:
  characterization-plan:
    build:
      context: .
      dockerfile: Dockerfile.characterization
    command: timeout --signal=TERM --kill-after=30s 2m node --test config/scripts/verify-characterization-plan.node-test.mjs
    init: true
