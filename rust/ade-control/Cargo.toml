[package]
name = "ade-control"
version = "0.1.0"
edition = "2021"

[dependencies]
ade-host = { path = "../ade-host" }
ade-host-platform = { path = "../ade-host-platform" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography"] }
