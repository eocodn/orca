[package]
name = "ade-terminal"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ade-terminal"
path = "src/main.rs"

[[bin]]
name = "ade-pty"
path = "src/bin/ade-pty.rs"

[dependencies]
ade-host-core = { path = "../ade-host-core" }
portable-pty = "0.9"
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
