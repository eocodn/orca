name: ade-baseline-${ADE_BASELINE_RUN_ID:?set ADE_BASELINE_RUN_ID to a unique run identifier}

x-baseline-environment: &baseline-environment
  ADE_BASELINE_COMMIT: 79251d7a9861568dc261faabfa16df5347d1d008

x-product-check: &product-check
  build:
    context: .
    dockerfile: Dockerfile.baseline
    target: project-checks
  depends_on:
    baseline-source:
      condition: service_completed_successfully
  environment: *baseline-environment
  init: true
  volumes:
    - baseline-source:/baseline:ro
    - ./.git:/repository/.git:ro

services:
  baseline-tests:
    build:
      context: .
      dockerfile: Dockerfile.baseline
      target: verifier
    init: true
    command: sh -euc 'timeout --signal=TERM --kill-after=30s 2m node --test config/scripts/verify-fork-baseline.node-test.mjs'
    volumes:
      - ./.git:/workspace/.git:ro

  baseline-verifier-candidate:
    build:
      context: .
      dockerfile: Dockerfile.baseline
      target: verifier
    command: sh -euc "timeout --signal=TERM --kill-after=30s 2m node --test --test-name-pattern='rejects|runs product|accepts only' config/scripts/verify-fork-baseline.node-test.mjs"
    init: true
    volumes:
      - ./.git:/workspace/.git:ro

  baseline-source:
    build:
      context: .
      dockerfile: Dockerfile.baseline
      target: baseline-source
    command:
      - timeout
      - --signal=TERM
      - --kill-after=30s
      - 5m
      - sh
      - -euc
      - |
        if [ -e /baseline/.git ] && [ ! -e /baseline/.git/ade-baseline-ready ]; then
          echo 'partial baseline volume; retry with a new ADE_BASELINE_RUN_ID' >&2
          exit 70
        fi
        if [ ! -e /baseline/.git/ade-baseline-ready ]; then
          git config --global --add safe.directory /repository/.git
          git clone --shared --no-checkout /repository/.git /baseline
          git -C /baseline checkout --detach "$$ADE_BASELINE_COMMIT"
          printf '%s\n' "$$ADE_BASELINE_COMMIT" > /baseline/.git/ade-baseline-ready
        fi
        test "$$(cat /baseline/.git/ade-baseline-ready)" = "$$ADE_BASELINE_COMMIT"
        test "$$(git -C /baseline rev-parse HEAD)" = "$$ADE_BASELINE_COMMIT"
        test -z "$$(git -C /baseline status --porcelain)"
    environment: *baseline-environment
    init: true
    volumes:
      - baseline-source:/baseline
      - ./.git:/repository/.git:ro

  baseline-core-tests:
    <<: *product-check
    command: sh -euc 'cp -a /baseline/. /workspace/; corepack enable; pnpm install --frozen-lockfile --ignore-scripts; timeout --signal=TERM --kill-after=30s 20m pnpm test'

  baseline-web-build:
    <<: *product-check
    command: sh -euc 'cp -a /baseline/. /workspace/; corepack enable; pnpm install --frozen-lockfile --ignore-scripts; timeout --signal=TERM --kill-after=30s 20m pnpm build:web'

  baseline-mobile-typecheck:
    <<: *product-check
    command: sh -euc 'cp -a /baseline/. /workspace/; cd mobile; corepack enable; pnpm install --frozen-lockfile; timeout --signal=TERM --kill-after=30s 20m pnpm typecheck'

  baseline-mobile-tests:
    <<: *product-check
    command: sh -euc 'cp -a /baseline/. /workspace/; cd mobile; corepack enable; pnpm install --frozen-lockfile; timeout --signal=TERM --kill-after=30s 20m pnpm test'

volumes:
  baseline-source:
